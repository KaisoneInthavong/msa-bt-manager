name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          # Clean, non-incremental build (avoids stale Kotlin incremental caches on runners)
          ./gradlew clean assembleDebug --no-daemon --rerun-tasks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: msa-bt-manager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
